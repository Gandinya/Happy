
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku Ya?</title>
    <style>
        /* Gaya dasar untuk mempercantik halaman */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffccd5; /* Warna pink pastel */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Biar ngga ada scroll saat tombol loncat */
        }

        #main-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 30px;
        }

        /* Gaya untuk tombol */
        .btn {
            font-size: 18px;
            padding: 12px 30px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        #btn-yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        #btn-yes:hover {
            background-color: #c9184a;
        }

        #btn-no {
            background-color: #8d99ae;
            color: white;
            box-shadow: 0 5px 15px rgba(141, 153, 174, 0.4);
            position: relative; /* Akan diubah ke absolute oleh JS nanti */
        }

        /* Halaman hasil setelah dimaafin */
        #result-container {
            display: none;
            text-align: center;
        }

        #result-container h1 {
            font-size: 3em;
            color: #c9184a;
        }

        /* Animasi Slide dari bawah ke atas */
        .slide-up {
            animation: slideUpAnim 0.8s ease-out forwards;
        }

        @keyframes slideUpAnim {
            0% {
                opacity: 0;
                transform: translateY(100px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Kontainer Pertanyaan -->
    <div id="main-container">
        <h1>Maafin aku ya delaaaaaaaa jangan marahh? 🥺</h1>
        <div id="button-group">
            <button class="btn" id="btn-yes">Dimaafin</button>
            <button class="btn" id="btn-no">Engga</button>
        </div>
    </div>

    <!-- Kontainer Hasil (Disembunyikan di awal) -->
    <div id="result-container">
        <h1 class="slide-up">Makasih yaa sayang ❤️🥰</h1>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const mainContainer = document.getElementById('main-container');
        const resultContainer = document.getElementById('result-container');

        // Fungsi biar tombol 'Engga' loncat-loncat
        function kabur() {
            // Ubah posisi jadi absolute agar bisa pindah bebas di layar
            btnNo.style.position = 'absolute';
            
            // Hitung ukuran layar dikurangi ukuran tombol biar gak keluar layar
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;

            // Generate posisi acak
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Terapkan posisi baru
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Bikin tombolnya loncat pas disorot mouse (di HP juga berlaku kalo pas mau di-tap)
        btnNo.addEventListener('mouseover', kabur);
        btnNo.addEventListener('click', kabur);
        btnNo.addEventListener('touchstart', kabur); // Khusus layar sentuh / HP

        // Aksi kalau tombol 'Dimaafin' dipencet
        btnYes.addEventListener('click', function() {
            // Sembunyikan pertanyaan
            mainContainer.style.display = 'none';
            // Tampilkan hasil dengan animasi slide
            resultContainer.style.display = 'block';
        });
    </script>

</body>
</html>
